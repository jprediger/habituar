services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: habituar
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./apps/api/db/bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d habituar']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
