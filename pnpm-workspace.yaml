packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
engineStrict: true
saveExact: true

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild

catalog:
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  "@types/react": 19.2.18

overrides:
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  # `@expo/ui` (via expo-router) aceita worklets acima do que o `expo-modules-core` do SDK
  # 57 suporta, e `@react-native/community-cli-plugin` exige o metro-config da própria
  # versão do React Native. Sem estes pinos, o install resolve 0.12.x e 0.87.x.
  react-native-worklets: 0.10.1
  # Peer opcional `*` do expo-router: sem pino, o install puxa a última versão, que exige um
  # worklets acima do fixado acima e quebra o build nativo. 4.5.1 é o par do SDK 57.
  react-native-reanimated: 4.5.1
  "@react-native/metro-config": 0.86.3
