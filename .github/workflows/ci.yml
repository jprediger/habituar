name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull PostgreSQL test image
        run: docker pull postgres:18-alpine

      - name: Verify forbidden boundaries
        run: pnpm test:boundaries

      - name: Check affected workspaces
        if: github.event_name == 'pull_request'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:affected

      - name: Check all workspaces
        if: github.event_name == 'push'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pnpm check

      # Roda sempre, inclusive em pull request: o filtro de afetados não alcança um
      # desalinhamento entre a versão instalada e a que o SDK do Expo espera, e é
      # justamente esse desalinhamento que quebra o Metro em vez do lint.
      - name: Verify expo monorepo health
        run: pnpm --filter @habituar/mobile expo:doctor

      # `pnpm check` não constrói os apps, então nada exercitava o bundle de produção.
      - name: Build every workspace
        run: pnpm build

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
